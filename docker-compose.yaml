services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      account:
        condition: service_started
      catalog:
        condition: service_started
      order:
        condition: service_started
    restart: on-failure

  account:
    build:
      context: ./account
      dockerfile: Dockerfile
    depends_on:
      account_db:
        condition: service_healthy
    environment:
      ACCOUNT_DB_URL: ${ACCOUNT_DB_URL}
      ACCOUNT_PORT: ${ACCOUNT_PORT}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "9090:9090"
    restart: on-failure

  catalog:
    build:
      context: ./catalog
      dockerfile: Dockerfile
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
      CATALOG_PORT: ${CATALOG_PORT}
    ports:
      - "9091:9091"
    restart: on-failure

  order:
    build:
      context: ./order
      dockerfile: Dockerfile
    depends_on:
      order_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ORDER_DB_URL: ${ORDER_DB_URL}
      ORDER_PORT: ${ORDER_PORT}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL}
      EMAIL_QUEUE_NAME: ${EMAIL_QUEUE_NAME}
      AMQP_URL: ${AMQP_URL}
    ports:
      - "9092:9092"
    restart: on-failure

  email:
    build:
      context: ./email
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      RECIPIENT_EMAIL: ${RECIPIENT_EMAIL}
      EMAIL_QUEUE_NAME: ${EMAIL_QUEUE_NAME}
      AMQP_URL: ${AMQP_URL}
    restart: on-failure

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  account_db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - account_pgdata:/var/lib/postgresql/data
      - ./account/up.sql:/docker-entrypoint-initdb.d/1.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgdb -d pgdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.23
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms128m -Xmx128m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep -vq ''"status":"red"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  order_db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - order_pgdata:/var/lib/postgresql/data
      - ./order/up.sql:/docker-entrypoint-initdb.d/1.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgdb -d pgdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  account_pgdata:
  esdata:
  order_pgdata:
