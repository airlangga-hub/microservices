syntax = "proto3";
package pb;
option go_package = "github.com/airlangga-hub/microservices/services/account/pb";

message Account {
    int32 id = 1;
    string email = 2;
    string password = 3;
}

message SignUpRequest {
    string email = 1;
    string password = 2;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

service AccountService {
    rpc SignUp(SignUpRequest) returns (Account);
    rpc Login(LoginRequest) returns (Account);
}